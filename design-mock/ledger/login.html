<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Kosh — Sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="ledger.css" />
  </head>
  <body>
    <main class="auth">
      <div class="box">
        <div style="display: flex; align-items: center; gap: var(--space-2)">
          <span class="brand-mark" style="width: 32px; height: 32px; font-size: 15px">क</span>
          <span class="brand-name" style="font-size: 19px">Kosh</span>
        </div>
        <div>
          <h1 class="page-title" style="font-size: 26px">Welcome back</h1>
          <p class="small" style="margin-top: 4px">
            Your statements stay on your account. Nothing is shared, nothing is sold.
          </p>
        </div>
        <div class="card">
          <label style="display: flex; flex-direction: column; gap: 5px">
            <span class="eyebrow">Email</span>
            <span class="field"><input type="email" placeholder="you@example.com" /></span>
          </label>
          <label style="display: flex; flex-direction: column; gap: 5px">
            <span class="eyebrow">Password</span>
            <span class="field"><input type="password" placeholder="••••••••" /></span>
          </label>
          <button class="btn primary">Sign in</button>
          <span class="rule">or</span>
          <button class="btn">
            <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.9h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.4Z"/>
              <path fill="#34A853" d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.7-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22Z"/>
              <path fill="#FBBC05" d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1a10 10 0 0 0 0 9.2L6.4 14Z"/>
              <path fill="#EA4335" d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.8-2.8A10 10 0 0 0 3.1 7.4L6.4 10c.8-2.4 3-4.1 5.6-4.1Z"/>
            </svg>
            Continue with Google
          </button>
        </div>
        <p class="small" style="text-align: center">
          New here? <a href="#">Create an account</a> · <a href="#">Forgot password</a>
        </p>
      </div>
    </main>
    <script src="shell.js"></script>
  </body>
</html>
